name: Scrapeo programado de perros

on:
  schedule:
    # Ejecutar cada 15 minutos
    - cron: "*/15 * * * *"
  workflow_dispatch:       # Permite ejecución manual desde GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas

      - name: Ejecutar scraper
        env:
          TELEGRAM_API: ${{ secrets.TELEGRAM_API }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Commit y push de cambios (CSV y nuevas fotos)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add perros_vitoria_historico.csv fotos_perros/ telegram_bot.py scraper.py .gitignore README.md .github/
          # Solo commitear si hay cambios
          if git diff --staged --quiet; then
            echo "No hay cambios que commitear."
          else
            git commit -m "🤖 Scrapeo automático $(date +'%Y-%m-%d %H:%M')"
            git push
          fi